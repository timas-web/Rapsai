<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapsų skaičiuoklė</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101d15;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: #1d3427;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      margin-bottom: 20px;
      background: #2a4734;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #75d68b;
      cursor: pointer;
    }

    .result {
      display: none;
      margin-top: 20px;
      background: #183b23;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .row {
      margin-bottom: 20px;
    }

    .title {
      color: #b9c9bf;
      font-size: 15px;
    }

    .value {
      font-size: 34px;
      font-weight: bold;
      margin-top: 5px;
    }

    .total {
      color: #75d68b;
      font-size: 42px;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🌱 Rapsų skaičiuoklė</h1>

    <label>Kiek gramų iš 200 g</label>
    <input type="text" id="a" placeholder="Pvz. 5,844">

    <label>Kiek gramų iš 10 g</label>
    <input type="text" id="b" placeholder="Pvz. 0,163">

    <button onclick="skaiciuoti()">
      Skaičiuoti
    </button>

    <div class="error" id="error"></div>

    <div class="result" id="result">

      <div class="row">
        <div class="title">Iš 200 g</div>
        <div class="value" id="rez200">0,00 %</div>
      </div>

      <div class="row">
        <div class="title">Iš 10 g</div>
        <div class="value" id="rez10">0,0 %</div>
      </div>

      <div class="row">
        <div class="title">Iš viso</div>
        <div class="value total" id="rezViso">0,00 %</div>
      </div>

    </div>

  </div>

  <script>
    function nuskaityti(id) {
      return parseFloat(
        document
          .getElementById(id)
          .value
          .replace(",", ".")
      );
    }

    function skaiciuoti() {
      const a = nuskaityti("a");
      const b = nuskaityti("b");

      const error = document.getElementById("error");
      const result = document.getElementById("result");

      if (isNaN(a) || isNaN(b)) {
        error.textContent = "Įveskite abu skaičius.";
        result.style.display = "none";
        return;
      }

      error.textContent = "";

      const is200g = (a / 200) * 100;

      const is10g =
        (((200 - a) * b) / 2000) * 100;

      const viso =
        is200g + is10g;

      document.getElementById("rez200").textContent =
        is200g.toLocaleString("lt-LT", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " %";

      document.getElementById("rez10").textContent =
        is10g.toLocaleString("lt-LT", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1
        }) + " %";

      document.getElementById("rezViso").textContent =
        viso.toLocaleString("lt-LT", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " %";

      result.style.display = "block";
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        skaiciuoti();
      }
    });
  </script>

</body>
</html>
